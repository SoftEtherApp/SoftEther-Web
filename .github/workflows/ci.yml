name: CI

on:
  push:
    branches: [master, develop, fixes, features, chores, docs]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm run build
      - run: npm run test:deeplinks
      - run: npm run test:releasenotes
      - run: npm run test:smtp
      - run: npm run test:tokens
      - name: Responsive overflow check
        run: |
          npx vite preview --port 8791 --strictPort &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8791/ >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/responsive.mjs http://127.0.0.1:8791
